<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>52 months</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3a0f1d,#14060b 70%);font-family:Georgia,'Times New Roman',serif;color:#d9b46a}
#st{position:relative;width:100%;height:100%}
.k{position:absolute;transition:left .7s ease,top .7s ease,transform .45s ease,opacity .7s ease}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s}
.k.f .in{transform:rotateY(180deg)}
.b,.fc{position:absolute;inset:0;border-radius:8%/6%;backface-visibility:hidden;border:1px solid #d9b46a}
.b{background:repeating-linear-gradient(45deg,#7d1230 0 5px,#5a0c22 5px 10px);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.fc{transform:rotateY(180deg);background:#fbf4e6;color:#222;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:bold}
.fc.r{color:#c8213f}
.fc i{font-style:normal;font-size:.45em;position:absolute;top:6%;left:10%}
#re{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:none;border:1px solid #d9b46a;color:#d9b46a;padding:8px 18px;border-radius:20px;font:inherit;cursor:pointer;opacity:0;transition:opacity .6s}
#re.on{opacity:1}
</style></head><body>
<div id="st"></div><button id="re">Again</button>
<script>
var st=document.getElementById("st"),re=document.getElementById("re"),LET="52 MONTHS".split(""),SU=["♥","♦","♣","♠"];
var W,w,h,H,cards,deck,busy=false;
var sl=function(t){return new Promise(function(r){setTimeout(r,t)})};
function setup(){
  st.innerHTML="";W=innerWidth;H=innerHeight;
  w=Math.min(70,(W-24)/9.5);h=w*1.4;cards=[];
  for(var i=0;i<52;i++){
    var k=document.createElement("div");k.className="k";k.style.width=w+"px";k.style.height=h+"px";
    k.innerHTML='<div class="in"><div class="b"></div><div class="fc"></div></div>';
    st.appendChild(k);cards.push(k);put(k,W/2-w/2-i*.25,H/2-h/2-i*.25);k.style.zIndex=i;
  }
  deck=cards.slice();
}
function put(k,x,y){k.style.left=x+"px";k.style.top=y+"px"}
async function shuffle(){
  for(var r=0;r<4;r++){
    for(var i=0;i<52;i++)deck[i].style.transform=i<26?"translateX("+(-w*1.3)+"px) rotate(-7deg)":"translateX("+(w*1.3)+"px) rotate(7deg)";
    await sl(500);
    var nd=[];for(var j=0;j<26;j++){nd.push(deck[j+26]);nd.push(deck[j])}
    deck=nd;deck.forEach(function(k,i){k.style.zIndex=i;k.style.transform="none"});
    await sl(450);
  }
}
async function spread(){
  var gap=Math.max(3,w*.12),gh=6*(h+gap)-gap,gw=9*(w+gap)-gap,x0=(W-gw)/2,y0=(H-gh)/2;
  deck.forEach(function(k,i){put(k,x0+(i%9)*(w+gap),y0+Math.floor(i/9)*(h+gap))});
  await sl(1000);
}
async function reveal(){
  var pick=deck.slice().sort(function(){return Math.random()-.5}).slice(0,8),map=[];
  var li=0;
  for(var p=0;p<9;p++){if(LET[p]===" ")continue;
    var k=pick[li++],red=Math.random()<.5,s=SU[Math.floor(Math.random()*4)];
    var f=k.querySelector(".fc");f.className="fc"+(s==="♥"||s==="♦"?" r":"");
    f.style.fontSize=(w*.8)+"px";f.innerHTML="<i>"+s+"</i>"+LET[p];
    map.push([k,p]);
  }
  for(var m=0;m<map.length;m++){map[m][0].classList.add("f");map[m][0].style.zIndex=100;await sl(350)}
  await sl(1200);
  cards.forEach(function(k){if(!map.some(function(a){return a[0]===k}))k.style.opacity=0});
  var gap=Math.max(3,w*.12),x0=(W-(9*(w+gap)-gap))/2;
  map.forEach(function(a){put(a[0],x0+a[1]*(w+gap),H/2-h/2)});
  await sl(900);re.classList.add("on");
}
async function run(){
  if(busy)return;busy=true;re.classList.remove("on");setup();
  await sl(700);await shuffle();await spread();await reveal();busy=false;
}
re.onclick=run;
addEventListener("resize",function(){if(!busy)run()});
run();
</script></body></html>
